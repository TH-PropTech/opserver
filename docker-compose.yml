services:
  redis:
    image: redis:7-alpine
    container_name: th-proptech-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --save
      - ''
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    mem_limit: ${REDIS_MEM_LIMIT:-192m}
    ports:
      - '${REDIS_BIND_IP:-0.0.0.0}:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  redis-data:
